# ============================================
# TileServer GL - Servidor de Tiles/Mapas
# ============================================
# Servicio para servir teselas de mapas (vector y raster)
# Puerto: 8080
# Descarga automáticamente datos de Cuba
# ============================================

version: '3.8'

services:
  tileserver:
    build:
      context: .
      dockerfile: Dockerfile.tileserver
    container_name: rapido-tileserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - tileserver_data:/data
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  tileserver_data:
