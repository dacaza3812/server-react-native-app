# Nixpacks will auto-detect this as a Node.js project
# This file ensures proper configuration for Dokploy deployment

# Required environment variables (configure in Dokploy UI):
# - MONGO_URI: MongoDB connection string
# - REDIS_URL: Redis connection string (optional)
# - ACCESS_TOKEN_SECRET: JWT secret key
# - ACCESS_TOKEN_EXPIRY: JWT expiry (e.g., 4d)
# - REFRESH_TOKEN_SECRET: JWT refresh secret
# - REFRESH_TOKEN_EXPIRY: JWT refresh expiry (e.g., 30d)
# - API_BASE_URL: Base URL for API callbacks (e.g., https://your-api.com)
# - PROJECT_ID: Firebase project ID (optional)
# - PRIVATE_KEY_ID: Firebase private key ID (optional)
# - PRIVATE_KEY: Firebase private key (optional)
# - CLIENT_EMAIL: Firebase client email (optional)
# - CLIENT_ID: Firebase client ID (optional)
# - CLOUDINARY_CLOUD_NAME: Cloudinary cloud name (optional)
# - CLOUDINARY_API_KEY: Cloudinary API key (optional)
# - CLOUDINARY_API_SECRET: Cloudinary API secret (optional)

# Setup phase - must come before build
[phases.setup]
nixpkgs = ["nodejs_20"]

# Build phase - use npm install instead of npm ci to avoid cache conflicts
[phases.build]
cmds = ["npm install --production"]

[start]
cmd = "npm run start:prod"

# Expose port for Traefik/Dokploy
[expose]
port = 3000

[variables]
NODE_ENV = "production"
PORT = "3000"
